name: quality-gate

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecommerce/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend quality gate
        run: npm run check

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecommerce/backend/requirements.txt

      - name: Verify directory structure
        working-directory: .
        run: python scripts/check_structure.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

      - name: Verify production isolation policy
        working-directory: ecommerce
        run: python scripts/verify_production_config.py

      - name: Run backend tests
        run: python -m pytest

      - name: Verify migration graph
        run: python -m alembic heads
