# 本地开发 Compose 文件。
# 新克隆项目后无需创建 .env；下方 ${VAR:-default} 已提供本地默认值。
# 如果 ecommerce/.env 存在，Docker Compose 会自动读取并覆盖这些默认值。
# 修改数据库账号/密码后如需重新初始化本地数据库，请执行 docker compose down -v。

services:
  postgres:
    image: postgres:16-alpine
    container_name: pangchong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pangchong_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-pangchong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pangchong_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./database/components.sql:/docker-entrypoint-initdb.d/03-components.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pangchong} -d ${POSTGRES_DB:-pangchong_ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pangchong-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-pangchong_dev_redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pangchong_dev_redis}", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pangchong-backend
    container_name: pangchong-backend
    restart: unless-stopped
    environment:
      # Defense/local mode is intentionally pinned to the bundled PostgreSQL.
      # Remote DATABASE_URL values belong in docker-compose.prod.yml or manual runs.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pangchong}:${POSTGRES_PASSWORD:-pangchong_dev_password}@postgres:5432/${POSTGRES_DB:-pangchong_ecommerce}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-pangchong_dev_redis}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-local-dev-secret}
      - DEBUG=${DEBUG:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost","http://localhost:80"]}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID:-}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY:-}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY:-}
      - ALIPAY_SANDBOX=${ALIPAY_SANDBOX:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ASSET_STORAGE_BACKEND=local
      - SUPABASE_IMAGE_BUCKET=${SUPABASE_IMAGE_BUCKET:-catalog-images}
      - SUPABASE_MODEL_BUCKET=${SUPABASE_MODEL_BUCKET:-catalog-models}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-23068672}
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pangchong-frontend
    container_name: pangchong-frontend
    restart: unless-stopped
    environment:
      - VITE_API_TARGET=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
